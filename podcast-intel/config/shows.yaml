# Shows to read every day. Judge a show by its guests and content, not its audience size.
# Don't drop a show after two quiet episodes: the gold is often one passing remark weeks later.
#
# podscan_id: fill from `python intel.py discover` output or Podscan's site.
# Starter list of likely-relevant shows. VERIFY each exists and is active, then add podscan_id.

